name: Ops — Neon (migrate/import/seed/embed)
on:
  workflow_dispatch:
    inputs:
      listino_url:
        description: "URL diretto del listino AGB PDF (default: link registrato in CLAUDE.md)"
        required: false
        default: "https://drive.usercontent.google.com/download?id=1TugU94aM6OP557ELiLQpH0nUxhxrXMUz&export=download&confirm=t"
      listino_colombo_url:
        description: "URL diretto del listino COLOMBO xlsx (reparto maniglie). Vuoto = salta l'import."
        required: false
        default: "https://drive.usercontent.google.com/download?id=1FV7AEKVe67tlIGOMrglVi3ip8TdZNueI&export=download&confirm=t"
      vision_url:
        description: "URL diretto del listino COLOMBO «Vision 2026» PDF (delta 05/26). Vuoto = salta l'import."
        required: false
        default: "https://drive.usercontent.google.com/download?id=1BO66H81J3-JlOh8vl4htwX_rHl93B1mM&export=download&confirm=t"
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm 10)
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Download listino PDF
        # L'input non fidato passa da una env var (mai interpolato nello script) per
        # evitare command-injection sul runner (secret DB/Gemini/seed in scope).
        env:
          LISTINO_URL: ${{ github.event.inputs.listino_url }}
        run: |
          curl -sSL "$LISTINO_URL" -o listino.pdf
          head -c 5 listino.pdf | grep -q '%PDF' || { echo "::error::Il download non è un PDF valido"; exit 1; }
          echo "PDF scaricato: $(wc -c < listino.pdf) byte, $(pdfinfo listino.pdf | awk '/Pages/{print $2}') pagine"
      - name: Migrate deploy (Neon + pgvector/pg_trgm)
        run: pnpm exec prisma migrate deploy
      - name: Import catalogo (7.488 prodotti, popola anche listino_page)
        run: pnpm import:agb listino.pdf
      - name: Seed admin + template kit
        run: |
          pnpm db:seed
          pnpm db:seed:kit
      # Reparto MANIGLIE. Sta DOPO migrazione, import AGB e seed di proposito: se
      # il download da Drive fallisse, il resto è già applicato — e la finestra di
      # disservizio a zero dipende dal fatto che la migrazione passi comunque.
      #
      # Idempotente: `upsert` su (brand, code). Riscrive `last_listing_at`, che è
      # ciò che rende visibile «non più a listino» quando COLOMBO toglie un codice.
      - name: Import listino COLOMBO (reparto maniglie)
        if: ${{ github.event.inputs.listino_colombo_url != '' }}
        # L'input non fidato passa da una env var e non viene mai interpolato
        # nello script: sul runner sono in scope i secret di DB e Gemini.
        env:
          LISTINO_COLOMBO_URL: ${{ github.event.inputs.listino_colombo_url }}
        run: |
          curl -sSL "$LISTINO_COLOMBO_URL" -o listino-colombo.xlsx
          # Un xlsx è uno zip: se Drive restituisce una pagina HTML di errore, il
          # parser fallirebbe con un messaggio che non dice cosa è successo.
          head -c 2 listino-colombo.xlsx | grep -q 'PK' || { echo "::error::Il download non è un xlsx valido"; exit 1; }
          echo "xlsx scaricato: $(wc -c < listino-colombo.xlsx) byte"
          pnpm import:listino COLOMBO listino-colombo.xlsx

      # DELTA del listino 05/26: AGGIUNGE i prodotti nuovi (Laconica, Robot6,
      # Robot6 S, Halo, Kubo e complementi) e aggiorna i 17 codici condivisi,
      # senza dichiarare che il resto non è più a listino — cosa che un delta
      # non è in condizione di sapere. Sta DOPO l'import COLOMBO perché
      # presuppone la base: i 17 aggiornamenti cadrebbero a vuoto su un
      # database in cui il listino 02/26 non è ancora entrato.
      - name: Import listino Vision 2026 (reparto maniglie)
        if: ${{ github.event.inputs.vision_url != '' }}
        # L'input non fidato passa da una env var e non viene mai interpolato
        # nello script: sul runner sono in scope i secret di DB e Gemini.
        env:
          VISION_URL: ${{ github.event.inputs.vision_url }}
        run: |
          curl -sSL "$VISION_URL" -o vision.pdf
          # La guardia dello step sopra cerca 'PK' perché importa uno zip: qui
          # il file è un PDF, e la sua firma è un'altra. Senza, un errore HTML
          # di Drive arriverebbe al parser come testo cifrato illeggibile.
          head -c 5 vision.pdf | grep -q '%PDF' || { echo "::error::Il download non è un PDF valido"; exit 1; }
          echo "PDF scaricato: $(wc -c < vision.pdf) byte, $(pdfinfo vision.pdf | awk '/Pages/{print $2}') pagine"
          pnpm import:vision COLOMBO vision.pdf

      - name: Embed catalogo (idempotente, batch 50)
        run: pnpm embed:products
